<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loco Config Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; margin-bottom: 30px; color: #1a1a2e; }
        h1 span { color: #667eea; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: #f8f9fa;
        }
        input:focus { outline: none; border-color: #667eea; background: white; }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input { flex: 1; padding-right: 50px; }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .generate-btn:hover { transform: scale(1.02); }
        .info {
            background: #f0f4ff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }
        .success-message {
            display: none;
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .success-message.show { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .success-message .filename {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 8px 15px;
            border-radius: 6px;
            font-family: monospace;
            display: inline-block;
            margin-top: 8px;
        }
        .download-again-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        @media (max-width: 480px) {
            .container { padding: 25px; }
            input { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ <span>Loco Config</span></h1>
        
        <form id="configForm">
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" id="username" placeholder="Enter PPP username" required>
            </div>
            
            <div class="form-group">
                <label>🔒 Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter PPP password" required>
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>📱 Device Name</label>
                <input type="text" id="deviceName" placeholder="e.g., N5L-Office" required>
            </div>
            
            <button type="submit" class="generate-btn">⬇️ Generate & Download</button>
        </form>
        
        <div class="info">
            <strong>ℹ️ What happens:</strong><br>
            • Replaces <strong>ppp.1.name</strong> with your username<br>
            • Replaces <strong>ppp.1.password</strong> with your password<br>
            • Downloads as <strong>[DeviceName].cfg</strong>
        </div>
        
        <div class="success-message" id="successMessage">
            <h3>✅ Config Downloaded!</h3>
            <p>Your file has been generated.</p>
            <div class="filename" id="filenameDisplay">N5L-Office.cfg</div>
            <br>
            <button class="download-again-btn" onclick="downloadAgain()">⬇️ Download Again</button>
        </div>
    </div>

        // Form submission
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const deviceName = document.getElementById('deviceName').value.trim();
            
            if (!username || !password || !deviceName) {
                alert('Please fill in all fields!');
                return;
            }
            
            // Replace placeholders
            let configContent = CONFIG_TEMPLATE
                .replace(/USER_USERNAME/g, username)
                .replace(/USER_PASSWORD/g, password);
            
            // Download the file
            const blob = new Blob([configContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = deviceName + '.cfg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Show success
            document.getElementById('filenameDisplay').textContent = deviceName + '.cfg';
            document.getElementById('successMessage').classList.add('show');
            
            // Store for download again
            window.lastConfig = {
                content: configContent,
                filename: deviceName + '.cfg'
            };
        });

        // Download again function
        function downloadAgain() {
            if (!window.lastConfig) {
                alert('Please generate a config first!');
                return;
            }
            const blob = new Blob([window.lastConfig.content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = window.lastConfig.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
